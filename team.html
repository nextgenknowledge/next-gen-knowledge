    <script>
    <style>

        /* =========================================================
           BASE
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #0A2342;
        }

        ::selection {
            background: rgba(201, 162, 39, 0.25);
            color: #0A2342;
        }


        /* =========================================================
           SCROLL REVEAL
        ========================================================= */

        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition:
                opacity 0.8s ease,
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }


        


        /* =========================================================
           HERO
        ========================================================= */

        .hero-section {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(201, 162, 39, 0.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(10, 35, 66, 0.07),
                    transparent 30%
                ),
                linear-gradient(
                    180deg,
                    #F7F9FC 0%,
                    #FFFFFF 100%
                );
        }

        .hero-grid {
            position: absolute;
            inset: 0;
            opacity: 0.35;
            background-image:
                linear-gradient(rgba(10, 35, 66, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 35, 66, 0.035) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: linear-gradient(
                to bottom,
                black 0%,
                transparent 85%
            );
        }

        .hero-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.14;
            pointer-events: none;
        }

        .orb-one {
            top: 100px;
            left: -120px;
            background: #C9A227;
        }

        .orb-two {
            right: -120px;
            top: 160px;
            background: #0A2342;
        }


        /* =========================================================
           BADGES
        ========================================================= */

        .gold-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 999px;
            background: rgba(201, 162, 39, 0.09);
            border: 1px solid rgba(201, 162, 39, 0.20);
            color: #A6841C;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .gold-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #C9A227;
            box-shadow: 0 0 0 5px rgba(201, 162, 39, 0.10);
        }


        /* =========================================================
           SECTION HEADINGS
        ========================================================= */

        .section-line {
            width: 48px;
            height: 4px;
            border-radius: 999px;
            background: #C9A227;
            margin: 14px auto 0;
        }

        .section-label {
            color: #A6841C;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }


        /* =========================================================
           TEAM CARDS
        ========================================================= */

        .team-card {
            position: relative;
            overflow: hidden;
            background: #F7F9FC;
            border: 1px solid rgba(10, 35, 66, 0.07);
            border-radius: 28px;
            box-shadow: 0 15px 45px -20px rgba(10, 35, 66, 0.18);
            transition:
                transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s ease,
                border-color 0.4s ease;
        }

        .team-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(
                90deg,
                #C9A227,
                #DFB73C,
                #C9A227
            );
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .team-card:hover {
            transform: translateY(-9px);
            box-shadow: 0 28px 65px -22px rgba(10, 35, 66, 0.25);
            border-color: rgba(201, 162, 39, 0.25);
        }

        .team-card:hover::before {
            opacity: 1;
        }

        .team-image {
            position: relative;
            overflow: hidden;
            height: 285px;
            border-radius: 21px;
            background: #E9EDF2;
        }

        .team-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .team-card:hover .team-image img {
            transform: scale(1.045);
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(5, 18, 36, 0.22),
                transparent 45%
            );
            pointer-events: none;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            border-radius: 999px;
            font-size: 10px;
            line-height: 1;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .role-executive {
            background: rgba(201, 162, 39, 0.11);
            color: #A6841C;
        }

        .role-leadership {
            background: rgba(10, 35, 66, 0.08);
            color: #0A2342;
        }

        .role-finance {
            background: rgba(201, 162, 39, 0.11);
            color: #A6841C;
        }

        .role-marketing {
            background: rgba(10, 35, 66, 0.08);
            color: #0A2342;
        }

        .team-divider {
            height: 1px;
            background: rgba(10, 35, 66, 0.07);
        }

        .info-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            color: rgba(10, 35, 66, 0.68);
            font-size: 11px;
            line-height: 1.6;
        }

        .info-row strong {
            color: #0A2342;
            font-weight: 700;
        }


        /* =========================================================
           MISSION CARD
        ========================================================= */

        .mission-card {
            position: relative;
            overflow: hidden;
            background: #0A2342;
            border-radius: 30px;
        }

        .mission-card::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            right: -120px;
            top: -140px;
            border-radius: 50%;
            background: rgba(201, 162, 39, 0.16);
            filter: blur(5px);
        }

        .mission-card::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            left: -90px;
            bottom: -100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        .footer-link {
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: #C9A227;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 767px) {

            .mobile-nav {
                background: rgba(255, 255, 255, 0.96);
                backdrop-filter: blur(15px);
            }

            .hero-section {
                padding-top: 135px;
            }

            .team-image {
                height: 300px;
            }

            .team-card {
                border-radius: 24px;
            }

            .mission-card {
                border-radius: 24px;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .reveal {
                opacity: 1;
                transform: none;
            }
        }

    </style>
</head>

    ========================================================= -->

    <script>

        lucide.createIcons();


        const reveals = document.querySelectorAll('.reveal');

        function revealOnScroll() {

            const windowHeight = window.innerHeight;

            reveals.forEach((element) => {

                const elementTop =
                    element.getBoundingClientRect().top;

                const elementVisible = 120;

                if (elementTop < windowHeight - elementVisible) {

                    element.classList.add('active');

                }

            });

        }


        window.addEventListener(
            'scroll',
            revealOnScroll,
            { passive: true }
        );


        window.addEventListener(
            'load',
            revealOnScroll
        );


        revealOnScroll();


        const nav = document.querySelector('nav');

        window.addEventListener(
            'scroll',
            () => {

                if (window.scrollY > 20) {

                    nav.classList.add(
                        'shadow-[0_8px_30px_rgba(10,35,66,0.06)]'
                    );

                } else {

                    nav.classList.remove(
                        'shadow-[0_8px_30px_rgba(10,35,66,0.06)]'
                    );

                }

            },
            { passive: true }
        );

    </script>
